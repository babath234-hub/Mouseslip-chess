name: Validate Mouseslip Chess

on:
  push:
    branches:
      - main
      - comprehensive-audit-2026-11-27
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("templates/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          Path("/tmp/mouseslip-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
      - name: Check JavaScript syntax
        run: node --check --input-type=module < /tmp/mouseslip-inline.js
